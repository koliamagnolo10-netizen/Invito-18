<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invito 18 Anni - Apri la Busta</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-neutral-950 flex flex-col items-center justify-center min-h-screen font-sans select-none p-4">

  <div class="relative w-full max-w-md h-[280px] flex items-center justify-center">
    <div id="envelope" class="w-full h-[280px] bg-stone-900 border-2 border-amber-600 rounded-b-xl shadow-2xl flex flex-col items-center justify-between relative z-20 overflow-visible pb-6">
      
      <div class="envelope-flap pointer-events-none"></div>

      <div class="text-center mt-8 z-10 pointer-events-none">
        <p class="text-stone-400 text-[10px] uppercase tracking-widest font-medium">Sei invitato</p>
        <h2 class="text-amber-400 font-serif text-base font-bold mt-0.5">Clicca sul sigillo per aprire</h2>
      </div>

      <div id="seal" class="wax-seal bg-gradient-to-br from-amber-400 via-yellow-200 to-amber-600 w-24 h-24 flex items-center justify-center cursor-pointer z-30 transition-transform duration-300 hover:scale-105 active:scale-95 my-auto shadow-xl">
        <span class="text-stone-950 font-serif text-3xl font-black tracking-tighter drop-shadow-sm pointer-events-none">18</span>
      </div>
      
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
